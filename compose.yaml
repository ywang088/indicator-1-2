services:
  mapping:
    build: .
    image: indicator-1-2:bundled-gpu
    platform: linux/amd64
    working_dir: /workspace
    gpus: all
    shm_size: 8gb
    volumes:
      - ./data:/workspace/data
      - ./results:/workspace/results
    command: ["bash", "scripts/01_build_18.sh"]
  compare:
    build: .
    image: indicator-1-2:bundled-gpu
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ./data:/workspace/data:ro
      - ./results:/workspace/results
    command: ["bash", "scripts/02_compare_full_map.sh"]
