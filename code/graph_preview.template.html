<script>
(()=>{
const DATA=__GRAPH_DATA__;
const root=document.getElementById('parking-graph-current'),graph=root.querySelector('#pg-graph'),space=root.querySelector('#pg-space'),choice=root.querySelector('#pg-choice'),detail=root.querySelector('#pg-detail'),NS='http://www.w3.org/2000/svg';
const index=new Map(DATA.nodes.map(n=>[n.id,n]));
const titles={scene:'场景',floor:'楼层待核验',region:'区域候选',portal:'门户候选',object:'物体候选',frame:'观测帧'},labels={column:'柱子',door:'门',elevator:'电梯',vehicle:'车辆'};

let view=DATA.views[0],selected=view.focus;
function add(tag,attrs,parent){let e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function text(value,x,y,parent,attrs={}){let e=add('text',{x,y,fill:'var(--foreground)',...attrs},parent);e.textContent=value;return e}
function select(id){selected=id;let n=index.get(id);detail.textContent=n.id+' · '+titles[n.kind]+' · '+(labels[n.label]||n.label)+' · 观测 '+n.observations+' 帧 · 相邻关系 '+n.neighbors+' 条'+(n.note?' · '+n.note:'')+(n.position?' · XYZ '+n.position.map(v=>v.toFixed(2)).join(', ')+' m':' · 无已确认位置');draw();drawSpace()}
function draw(){
 graph.replaceChildren();let width=Math.max(300,root.clientWidth),narrow=width<700;let levels=['region','portal','object','frame'],pos=new Map(),shown=levels.map(k=>view.nodes.map(i=>index.get(i)).filter(n=>n.kind===k));let rowHeight=46,totalHeight;

 else{totalHeight=Math.max(200,...shown.map(x=>x.length*rowHeight+85));for(let j=0;j<levels.length;j++){let x=(j+.5)*width/4;text(titles[levels[j]],x,22,graph,{'text-anchor':'middle'});text(shown[j].length+'/'+DATA.counts[levels[j]],x,43,graph,{'text-anchor':'middle',class:'text-small'});for(let i=0;i<shown[j].length;i++)pos.set(shown[j][i].id,[x,82+i*rowHeight]);}}

 let defs=add('defs',{},graph),marker=add('marker',{id:'pg-arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'},defs);add('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'var(--muted-foreground)'},marker);
 for(let e of view.edges){let a=pos.get(e.source),b=pos.get(e.target),same=Math.abs(a[0]-b[0])<2,dx=b[0]-a[0],sign=Math.sign(dx)||1;let x1=a[0]+(same?65:sign*63),x2=b[0]-(same?-65:sign*63);let d=same?`M ${x1} ${a[1]} Q ${x1+28} ${(a[1]+b[1])/2} ${x2} ${b[1]}`:`M ${x1} ${a[1]} C ${(x1+x2)/2} ${a[1]} ${(x1+x2)/2} ${b[1]} ${x2} ${b[1]}`;add('path',{d,fill:'none',stroke:'var(--muted-foreground)','stroke-width':e.source===selected||e.target===selected?1.7:1,opacity:e.source===selected||e.target===selected?.85:.35,'stroke-dasharray':e.kind.startsWith('candidate')?'4 3':'none','marker-end':'url(#pg-arrow)','data-tooltip':edgeNames[e.kind]+'：'+e.source+' → '+e.target},graph);}
 for(let id of view.nodes){let n=index.get(id),[x,y]=pos.get(id),g=add('g',{class:'node cursor-interaction'+(selected===id?' selected':''),'data-tooltip':id+' · '+(labels[n.label]||n.label)},graph);add('rect',{x:x-63,y:y-15,width:126,height:30,rx:5},g);let short=n.kind==='object'?(labels[n.label]||n.label)+' '+id.split(':').slice(-2).join(':'):n.kind==='portal'?'门 '+id.split(':').slice(-2).join(':'):n.kind==='frame'?n.label:n.kind==='scene'?'停车场':n.label;text(short,x,y+4,g,{'text-anchor':'middle',class:'text-small'});g.onclick=()=>select(id);}
}
function drawSpace(){let width=Math.max(300,root.clientWidth),height=550;space.replaceChildren();space.setAttribute('viewBox',`0 0 ${width} ${height}`);space.style.height=height+'px';let xs=DATA.points.map(p=>p[0]),zs=DATA.points.map(p=>p[1]),lo=[Math.min(...xs),Math.min(...zs)],hi=[Math.max(...xs),Math.max(...zs)],scale=Math.min((width-64)/(hi[0]-lo[0]),(height-64)/(hi[1]-lo[1]));let xy=p=>[(width-(hi[0]-lo[0])*scale)/2+(p[0]-lo[0])*scale,32+(hi[1]-p[1])*scale];
 for(let p of DATA.points){let[x,y]=xy(p);add('circle',{cx:x,cy:y,r:.65,fill:'var(--muted-foreground)',opacity:.35},space)}
 for(let p of DATA.objects){let[x,y]=xy(p);add('circle',{cx:x,cy:y,r:1,fill:'var(--viz-series-2)',opacity:.4},space)}
 for(let p of DATA.paths)add('polyline',{points:p.map(xy).map(p=>p.join(',')).join(' '),fill:'none',stroke:'var(--viz-series-1)','stroke-width':1.3,opacity:.8},space);
 for(let a of DATA.anchors){let[x,y]=xy([a.position[0],a.position[2]]);add('polygon',{points:`${x},${y-5} ${x+5},${y} ${x},${y+5} ${x-5},${y}`,fill:'var(--viz-series-3)','data-tooltip':a.label+' · '+a.id},space);text(a.label,x+8,y-6,space,{class:'text-small'})}
 let n=index.get(selected);if(n.position){let[x,y]=xy([n.position[0],n.position[2]]);add('circle',{cx:x,cy:y,r:8,fill:'none',stroke:'var(--foreground)','stroke-width':2},space)}
 add('line',{x1:24,y1:height-24,x2:24+10*scale,y2:height-24,stroke:'var(--foreground)','stroke-width':2},space);text('10 m · 场景 X / Z',24,height-34,space,{class:'text-small'});
}
for(let[v,i]of DATA.views.map((v,i)=>[v,i])){let o=document.createElement('option');o.value=i;o.textContent=v.name;choice.appendChild(o)}
choice.onchange=()=>{view=DATA.views[Number(choice.value)];select(view.focus)};select(selected);new ResizeObserver(()=>{draw();drawSpace()}).observe(root);
})();
</script>
</div>
