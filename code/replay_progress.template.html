<div id="parking-replays-1124">
<style>
#parking-replays-1124 {display:grid;gap:calc(var(--font-size-base)*.65)}
#parking-replays-1124 canvas {display:block;width:100%;height:410px}
#parking-replays-1124 .trajectory-grid {display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media(max-width:520px){#parking-replays-1124 .trajectory-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
<h2>18 条轨迹 · 增量区域与门户</h2>
<div class="text-small">逐帧区域与门户连接 · SAM3 缓存 + 柱子文字复核 · 非实时输入</div>
<div class="trajectory-grid" aria-label="选择轨迹"></div>
<div data-status aria-live="polite" class="tabular-nums"></div>
<canvas role="img" aria-label="截至选中关键帧已定位的物体和相机轨迹，世界坐标 X、Z，单位米"></canvas>
<div class="text-small">圆点：已定位物体　折线：已走路径　菱形：当前相机　方框：本轨迹建立的门户　非占据栅格</div>
<div class="viz-controls"><button type="button" class="btn btn-primary" data-play>播放</button><button type="button" class="btn" data-prev>上一帧</button><button type="button" class="btn" data-next>下一帧</button></div>
<label class="form-label">关键帧进度<input class="form-range" type="range" min="0" step="1" value="0" aria-label="关键帧进度"></label>
<div data-delta class="text-small tabular-nums"></div>
<div data-final class="text-small"></div>
<details data-evidence hidden><summary>查看 E–F 门户的柱子证据</summary><figure><img data-photo="0" style="width:100%;height:auto" alt="004325 左侧柱子清楚可见 F 字母"><figcaption>004325 · 左侧柱子 F 标识</figcaption></figure><figure><img data-photo="1" style="width:100%;height:auto" alt="004345 右侧 E 标识，左侧柱子沿用前帧关联"><figcaption>004345 · 右侧 E；左侧 F 来自同柱的前帧文字</figcaption></figure></details>
<div class="text-small">播放为演示速度；时间显示为采集时间。未记录端到端处理延迟，不能据此计算实时 FPS。</div>
<script type="application/json" data-replays>__REPLAY_DATA__</script>
<script>
(()=>{
const root=document.getElementById('parking-replays-1124'),D=JSON.parse(root.querySelector('[data-replays]').textContent),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),slider=root.querySelector('input'),play=root.querySelector('[data-play]');let tid=0,step=0,timer=null;
D.evidence_images?.forEach((src,i)=>root.querySelector('[data-photo="'+i+'"]').src=src);
const buttons=D.trajectories.map((t,i)=>{const b=document.createElement('button');b.className='btn viz-tile';b.type='button';b.textContent=t.id;b.setAttribute('aria-label',t.id+'，'+t.keyframes+' 个关键帧，已完成');b.onclick=()=>{stop();tid=i;step=0;render(true)};root.querySelector('.trajectory-grid').append(b);return b});
function color(token){const e=document.createElement('span');e.style.color='var('+token+')';root.append(e);const c=getComputedStyle(e).color;e.remove();return c}
function draw(){const t=D.trajectories[tid],cur=t.records[step],pts=new Map();for(let k=0;k<=step;k++)t.records[k].delta.forEach(p=>pts.set(p[0],[p[1],p[2]]));const all=t.records.flatMap(r=>[r.camera,...r.delta.map(p=>[p[1],p[2]])]),xs=all.map(p=>p[0]),zs=all.map(p=>p[1]);let xmin=Math.min(...xs)-3,xmax=Math.max(...xs)+3,zmin=Math.min(...zs)-3,zmax=Math.max(...zs)+3;const w=canvas.clientWidth,h=410,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const scale=Math.min((w-90)/(xmax-xmin),(h-65)/(zmax-zmin)),left=55+(w-90-(xmax-xmin)*scale)/2,top=15+(h-65-(zmax-zmin)*scale)/2,P=p=>[left+(p[0]-xmin)*scale,top+(zmax-p[1])*scale],fg=color('--foreground'),line=color('--border'),obj=color('--viz-series-1'),route=color('--viz-series-2');ctx.font=getComputedStyle(root).font;ctx.fillStyle=fg;ctx.strokeStyle=line;ctx.lineWidth=1;
 for(let j=0;j<4;j++){const x=xmin+(xmax-xmin)*j/3,z=zmin+(zmax-zmin)*j/3,a=P([x,zmin]),b=P([x,zmax]),c=P([xmin,z]),d=P([xmax,z]);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.moveTo(...c);ctx.lineTo(...d);ctx.stroke();ctx.textAlign='center';ctx.fillText(x.toFixed(0),a[0],h-25);ctx.textAlign='right';ctx.fillText(z.toFixed(0),left-8,c[1]+4)}ctx.textAlign='center';ctx.fillText('X (m)',w/2,h-5);ctx.textAlign='left';ctx.fillText('Z (m)',2,13);
 ctx.fillStyle=obj;ctx.globalAlpha=.65;pts.forEach(p=>{const q=P(p);ctx.beginPath();ctx.arc(...q,2,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.strokeStyle=route;ctx.lineWidth=2;ctx.beginPath();t.records.slice(0,step+1).forEach((r,i)=>{const q=P(r.camera);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke();t.records.slice(0,step+1).filter(r=>r.new_portals?.length).forEach(r=>{const q=P(r.camera);ctx.strokeStyle=color('--viz-series-3');ctx.lineWidth=3;ctx.strokeRect(q[0]-8,q[1]-8,16,16);ctx.fillStyle=fg;ctx.textAlign='center';ctx.fillText('E ↔ F',Math.max(40,Math.min(w-40,q[0])),Math.max(20,q[1]-14))});const q=P(cur.camera);ctx.fillStyle=route;ctx.beginPath();ctx.moveTo(q[0],q[1]-7);ctx.lineTo(q[0]+7,q[1]);ctx.lineTo(q[0],q[1]+7);ctx.lineTo(q[0]-7,q[1]);ctx.closePath();ctx.fill();}
function render(save=false){const t=D.trajectories[tid],r=t.records[step];root.querySelector('[data-evidence]').hidden=!(t.id==='T09'&&r.portals>0);slider.max=t.records.length-1;slider.value=step;buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===tid)));root.querySelector('[data-status]').textContent=t.id+' · 帧 '+r.fid+' · '+(step+1)+' / '+t.keyframes+' · 采集时间 +'+r.seconds.toFixed(1)+' s';root.querySelector('[data-delta]').textContent='物体记录 '+r.objects+' · 已定位 '+r.localized+' · 未定位 '+(r.objects-r.localized)+' · 本帧新增 '+r.new+' / 更新 '+r.updated+(r.regions?' · 当前区域 '+(r.regions.map(x=>x.split(':').pop()).join('、')||'无')+' · 门户 '+r.portals:'')+(r.new_portals?.length?' · 本帧新增门户':'');root.querySelector('[data-final]').textContent='该条回放终态：区域 '+(t.regions.join('、')||'未形成')+' · 门户 '+t.portals+' · 输入 '+t.source_steps+' 帧 / 建图更新 '+t.keyframes+' 帧';draw();if(save&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{trajectory:t.id,frame:r.fid,objects:r.objects},privateContent:{tid,step}}).catch(()=>{})}
function stop(){clearInterval(timer);timer=null;play.textContent='播放'}
play.onclick=()=>{if(timer){stop();return}if(step===D.trajectories[tid].records.length-1)step=0;render(true);play.textContent='暂停';timer=setInterval(()=>{if(step>=D.trajectories[tid].records.length-1){stop();return}step++;render(true)},800)};
root.querySelector('[data-prev]').onclick=()=>{stop();step=Math.max(0,step-1);render(true)};root.querySelector('[data-next]').onclick=()=>{stop();step=Math.min(D.trajectories[tid].records.length-1,step+1);render(true)};slider.oninput=()=>{stop();step=Number(slider.value);render(true)};
function restore(s){stop();tid=Number.isInteger(s?.tid)&&s.tid>=0&&s.tid<18?s.tid:8;step=Number.isInteger(s?.step)?Math.max(0,Math.min(s.step,D.trajectories[tid].records.length-1)):0;render()}
new ResizeObserver(draw).observe(canvas);new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState?.privateContent));restore(window.openai?.widgetState?.privateContent);
})();
</script>
</div>
